name: Paper trade

on:
  schedule:
    - cron: "7 * * * *" # hourly (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch: {} # allows manual "Run workflow" button

permissions:
  contents: write
  issues: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet ccxt pandas

      - name: Run paper-trading bot
        run: python gh-bot/bot.py

      - name: Alert on regime flips and trades
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COUNT=$(jq '.events | length' gh-bot/last_events.json 2>/dev/null || echo 0)
          if [ "$COUNT" != "0" ]; then
            BODY=$(jq -r '.events | join("\n")' gh-bot/last_events.json)
            gh issue create \
              --title "Trading alert: $COUNT event(s) $(date -u +'%Y-%m-%d %H:%M') UTC" \
              --body "$BODY

          Dashboard: https://aibotcoder-dev.github.io/crypto-trader/" \
              --repo "${{ github.repository }}"
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$BODY"
            fi
          fi

      - name: Commit updated state and dashboard data
        run: |
          git config user.name "paper-trade-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gh-bot/state.json docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Paper trade run $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main
            git push
          fi
