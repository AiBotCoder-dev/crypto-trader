name: Paper trade

on:
  schedule:
    - cron: "7 * * * *" # hourly (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch: {} # allows manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet ccxt pandas

      - name: Run paper-trading bot
        run: python gh-bot/bot.py

      - name: Commit updated state and dashboard data
        run: |
          git config user.name "paper-trade-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gh-bot/state.json docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Paper trade run $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main
            git push
          fi
